<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0" aria-hidden="true">
      <defs>
        <filter id="paola-dry-brush" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045 0.95" numOctaves="5" seed="8" result="grain"/>
          <feDisplacementMap in="SourceGraphic" in2="grain" scale="4.5" xChannelSelector="R" yChannelSelector="G" result="warp"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.12 0.35" numOctaves="3" seed="3" result="edge"/>
          <feDisplacementMap in="warp" in2="edge" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="paola-dry-brush-blue" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05 0.88" numOctaves="4" seed="11" result="grain"/>
          <feDisplacementMap in="SourceGraphic" in2="grain" scale="3.8" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="paola-dry-brush-light" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.06 0.55" numOctaves="3" seed="12" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="paola-stamped" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="5" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
          <feComponentTransfer>
            <feFuncA type="discrete" tableValues="1 1 0.85 1 0.9 1 0.95 1"/>
          </feComponentTransfer>
        </filter>
        <filter id="paola-brush-edge-soft" x="-4%" y="-20%" width="108%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04 0.08" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="paola-brush-edge" x="-8%" y="-40%" width="116%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.22" numOctaves="4" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <!-- Manchas brochazo reutilizables (bordes irregulares, no rect plano) -->
        <symbol id="brush-splash-blue" viewBox="0 0 320 48" preserveAspectRatio="none">
          <path d="M2,20 C24,9 52,15 78,11 C128,5 188,17 248,10 C284,7 308,13 318,17 L318,35 C304,41 278,33 248,37 C188,43 128,31 78,37 C52,39 24,35 2,28 Z" fill="#0088F8"/>
          <path d="M10,26 C70,18 150,30 230,22 C278,18 304,24 312,26" fill="none" stroke="#48B4FC" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
        </symbol>
        <symbol id="brush-splash-white" viewBox="0 0 320 48" preserveAspectRatio="none">
          <path d="M4,22 C26,12 54,16 80,13 C130,8 190,18 250,12 C286,9 310,15 316,19 L316,36 C302,42 276,34 246,38 C186,44 126,32 76,38 C50,40 22,36 4,30 Z" fill="#F7FAFC"/>
          <path d="M12,28 C72,20 152,32 232,24 C280,20 306,26 314,28" fill="none" stroke="#0088F8" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
        </symbol>
        <symbol id="brush-banner-bg" viewBox="0 0 800 52" preserveAspectRatio="none">
          <path d="M-8,12 C48,4 160,22 280,10 C440,2 580,20 720,8 C760,4 808,10 808,10 L812,38 C760,46 720,32 580,42 C440,50 280,34 48,42 C8,44 -8,36 -8,36 Z" fill="#0088F8"/>
          <path d="M0,20 C180,12 400,26 620,16 C700,12 800,18 800,18" fill="none" stroke="#48B4FC" stroke-width="4" opacity="0.28" stroke-linecap="round"/>
        </symbol>
        <symbol id="brush-divider-thick" viewBox="0 0 800 28" preserveAspectRatio="none">
          <path d="M-4,6 C100,2 220,14 360,8 C500,4 640,16 804,10 L804,24 C640,28 500,16 360,22 C220,26 100,14 -4,20 Z" fill="#0088F8"/>
          <path d="M0,14 C160,10 320,18 480,12 C640,8 720,14 800,12" fill="none" stroke="#48B4FC" stroke-width="3" opacity="0.32" stroke-linecap="round"/>
        </symbol>

        <!-- Decorativos brocha — viewBox 32×32, trazo 2.5, currentColor -->
        <symbol id="bd-heart" viewBox="0 0 32 32"><path d="M16 26.5S8 21 8 14.5a4.8 4.8 0 0 1 8.2-3.4A4.8 4.8 0 0 1 24 14.5C24 21 16 26.5 16 26.5z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
        <symbol id="bd-pin" viewBox="0 0 32 32"><path d="M16 28V14M16 14c3.3 0 6-2.4 6-5.5S19.3 3 16 3s-6 2.4-6 5.5 2.7 5.5 6 5.5z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="bd-helmet" viewBox="0 0 32 32"><path d="M8 18c0-5 3.6-9 8-9s8 4 8 9v3H8v-3z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M11 21h10M9 24h14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-bike" viewBox="0 0 32 32"><circle cx="9" cy="21" r="4.5" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="23" cy="21" r="4.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M9 21h6l3-8h4l2 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 13l2-4h5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-camera" viewBox="0 0 32 32"><path d="M6 12h4l2-3h8l2 3h4v12H6V12z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="16" cy="18" r="3.5" fill="none" stroke="currentColor" stroke-width="2.5"/></symbol>
        <symbol id="bd-spark" viewBox="0 0 32 32"><path d="M16 4v6M16 22v6M4 16h6M22 16h6M7.8 7.8l4.2 4.2M20 20l4.2 4.2M7.8 24.2l4.2-4.2M20 12l4.2-4.2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-star" viewBox="0 0 32 32"><path d="M16 5l2.8 6.8L26 13l-5.5 4.5L22 26l-6-3.8L10 26l1.5-8.5L6 13l7.2-1.2L16 5z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
        <symbol id="bd-check" viewBox="0 0 32 32"><path d="M8 17l5 5 11-12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="bd-arrow" viewBox="0 0 32 32"><path d="M8 16h14M18 10l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="bd-chat" viewBox="0 0 32 32"><path d="M8 8h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H14l-4 4v-4H8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
        <symbol id="bd-bolt" viewBox="0 0 32 32"><path d="M18 4L10 17h6l-2 11 10-14h-6l2-10z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
        <symbol id="bd-fire" viewBox="0 0 32 32"><path d="M16 28c-5-3-8-7-8-12 0-4 3-7 5-9 1 3 3 5 3 5s1-6 6-10c1 4 3 7 3 11 0 5-3 9-9 15z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
        <symbol id="bd-smile" viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11 14h.01M21 14h.01M12 20c2 2.5 6 2.5 8 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-scribble" viewBox="0 0 32 32"><path d="M6 22 C10 14 14 18 18 12 C22 8 24 10 26 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M8 26 C12 20 16 24 20 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.65"/></symbol>
        <symbol id="bd-flag" viewBox="0 0 32 32"><path d="M9 6v20M9 8h12l-2 4 2 4H9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="bd-route" viewBox="0 0 32 32"><path d="M8 24c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="8" cy="24" r="2" fill="currentColor"/><circle cx="24" cy="24" r="2" fill="currentColor"/><path d="M12 10h8M16 6v8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-glove" viewBox="0 0 32 32"><path d="M12 14V9a2 2 0 0 1 4 0v5M16 14V8a2 2 0 0 1 4 0v8l-1 9H11l-1-9v-3a2 2 0 0 1 4 0z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
        <symbol id="bd-wrench" viewBox="0 0 32 32"><path d="M10 22l10-10 2 2-10 10-4 1 1-4zM20 10l2-2 2 2-2 2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
        <symbol id="bd-quote" viewBox="0 0 32 32"><path d="M8 18h4v6H6v-6c0-3 2-5 4-6M20 18h4v6h-6v-6c0-3 2-5 4-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="bd-ticket" viewBox="0 0 32 32"><path d="M8 10h16v12H8V10zM12 10v12M20 16h.01" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="bd-shield" viewBox="0 0 32 32"><path d="M16 5l9 3v8c0 6-4 10-9 12-5-2-9-6-9-12V8l9-3z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
        <symbol id="bd-wave" viewBox="0 0 32 32"><path d="M4 18c3-3 6-3 9 0s6 3 9 0 6-3 9 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-cross" viewBox="0 0 32 32"><path d="M16 8v16M8 16h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-link" viewBox="0 0 32 32"><path d="M13 19l6-6M14 13l-2 2a3 3 0 0 0 4 4l2-2M18 19l2-2a3 3 0 0 0-4-4l-2 2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-copy" viewBox="0 0 32 32"><rect x="11" y="11" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M9 21H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-share" viewBox="0 0 32 32"><path d="M12 17v9h12V13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 7h6v6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 7L14 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
        <symbol id="bd-eye" viewBox="0 0 32 32"><path d="M6 16s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2.5"/></symbol>
        <symbol id="bd-vest" viewBox="0 0 32 32"><path d="M11 9l-2 5v14h14V14l-2-5H11zM13 9h6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M13 16h6M13 20h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/></symbol>
        <symbol id="bd-whatsapp" viewBox="0 0 32 32"><path d="M16 5a11 11 0 0 0-9.4 16.6L5.5 27l5.6-1.5A11 11 0 1 0 16 5z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M12.2 13.4c.3.7 1.2 2.8 3.1 4.1 1.9 1.3 3.5 1.4 4.1 1.5.6.1 1.3-.5 1.6-1.2.3-.7.3-1.2.1-1.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      </defs>
    </svg>